name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Matching Engine revision for candidate verification
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, intl
      - run: composer validate --strict
      - uses: actions/checkout@v5
        if: inputs.engine_ref != ''
        with:
          repository: MR-C0DE/phpaml-engine
          ref: ${{ inputs.engine_ref }}
          path: .ci/phpaml-engine
      - name: Select the candidate Engine dependency
        if: inputs.engine_ref != ''
        run: |
          php -r '$p=json_decode(file_get_contents("composer.json"),true); $e=json_decode(file_get_contents(".ci/phpaml-engine/composer.json"),true); $p["repositories"][]=["type"=>"path","url"=>".ci/phpaml-engine","options"=>["versions"=>["phpaml/engine"=>$e["extra"]["phpaml"]["version"]]]]; file_put_contents("composer.json",json_encode($p,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n");'
      - run: composer install --no-interaction --prefer-dist
      - run: composer docs:check
      - name: Run every PHP suite
        run: |
          php -r '$p=json_decode(file_get_contents("composer.json"),true); $failed=0; foreach($p["scripts"]["test"] as $command) { echo "Running $command\n"; passthru("timeout 120s ".$command,$code); if($code!==0) {fwrite(STDERR,"FAILED: $command\n"); $failed=1;} } exit($failed);'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Engine source-test dependencies
        run: |
          engine="$(php tests/language-level1.php --engine-root)"
          npm ci --prefix "$engine"
      - name: Run every frontend language suite
        run: |
          php -r '$p=json_decode(file_get_contents("composer.json"),true); $failed=0; foreach($p["scripts"]["test:language-runtime"] as $command) { echo "Running $command\n"; passthru("timeout 120s ".$command,$code); if($code!==0) {fwrite(STDERR,"FAILED: $command\n"); $failed=1;} } exit($failed);'

  frontend-packages:
    name: Installed frontend applications (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [full, modules]
    defaults:
      run:
        working-directory: phpaml-engine
    env:
      PHPAML_BROWSER_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: phpaml-view
      - uses: actions/checkout@v5
        with:
          repository: MR-C0DE/phpaml-engine
          ref: ${{ inputs.engine_ref || vars.PHPAML_ENGINE_TEST_REF || 'main' }}
          path: phpaml-engine
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: view-distributions-${{ matrix.runtime }}
          path: phpaml-engine/test-results/
          retention-days: 7

  nested-safari:
    name: Nested PHP control flow (actual Safari, both runtimes)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: phpaml-engine
    steps:
      - uses: actions/checkout@v5
        with:
          path: phpaml-view
      - uses: actions/checkout@v5
        with:
          repository: MR-C0DE/phpaml-engine
          ref: ${{ inputs.engine_ref || vars.PHPAML_ENGINE_TEST_REF || 'main' }}
          path: phpaml-engine
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:check
      - name: Verify nesting and recovery in Safari
        run: |
          mkdir -p test-results/nested-control-final
          sudo /usr/bin/safaridriver --enable
          /usr/bin/safaridriver -p 8121 > test-results/nested-control-final/safaridriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8121/status > /dev/null; then break; fi
            sleep 1
          done
          npm run test:safari:nesting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nested-control-safari
          path: phpaml-engine/test-results/nested-control-final/
          retention-days: 7
