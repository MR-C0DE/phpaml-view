name: Public API compatibility

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Matching Engine revision for candidate verification
        type: string
        required: false
  pull_request:
  push:
    branches: [main]

jobs:
  backward-compatibility:
    name: Compare public API with latest release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/checkout@v5
        if: inputs.engine_ref != ''
        with:
          repository: MR-C0DE/phpaml-engine
          ref: ${{ inputs.engine_ref }}
          path: .ci/phpaml-engine
      - name: Select the candidate Engine dependency
        if: inputs.engine_ref != ''
        run: |
          php -r '$p=json_decode(file_get_contents("composer.json"),true); $e=json_decode(file_get_contents(".ci/phpaml-engine/composer.json"),true); $p["repositories"][]=["type"=>"path","url"=>".ci/phpaml-engine","options"=>["versions"=>["phpaml/engine"=>$e["extra"]["phpaml"]["version"]]]]; file_put_contents("composer.json",json_encode($p,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n");'
      - name: Select the latest published version
        id: baseline
        shell: bash
        run: |
          tag="$(git tag --sort=-v:refname | head -n 1)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Comparing HEAD with $tag"
      - name: Reject accidental API breaks
        shell: bash
        run: |
          composer require --dev roave/backward-compatibility-check:^8.0 --with-all-dependencies --no-interaction --no-progress
          vendor/bin/roave-backward-compatibility-check --from="${{ steps.baseline.outputs.tag }}" --format=github-actions
